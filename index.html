<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Numstep:Classic - Daily Challenge</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="siteHeader">
    <h1>NUMSTEP</h1>

    <button
        class="moreButton"
        id="moreButton"
        type="button"
        aria-expanded="false"
        aria-controls="moreMenu"
    >
        <span class="hamburgerIcon" aria-hidden="true">☰</span>
        <span>more</span>
    </button>
</header>

<nav class="moreMenu" id="moreMenu" hidden aria-label="Game varieties">
    <a class="gameMenuItem active" href="index.html" aria-current="page">Classic</a>
    <a class="gameMenuItem" href="#cube" id="cubeMenuLink">Cube</a>
</nav>

<h2>Daily Challenge</h2>


<!-- Date navigation -->
<div class="date-navigation">

    <button id="prevDay" aria-label="Previous day">
        ←
    </button> <div id="currentDate"></div> <button id="nextDay" aria-label="Next day">
        →
    </button>

</div>


<!-- Printable PDF -->
<div class="printable-puzzle">

    <a id="pdfLink" href="#" target="_blank">
        <button>
            🖨️ Printable Puzzle
        </button>
    </a>

</div>


<!-- Game information -->
<div id="timer">00:00</div>

<div id="attempts">Attempts: 0</div>


<!-- Numstep grid -->
<div id="grid"></div>


<!-- Messages -->
<div id="message"></div>


<!-- Reset button -->
<button id="resetButton">RESET</button>

<!-- Numstep: Cube -->
<section class="cubeGame" id="cube" hidden aria-labelledby="cubeTitle">
    <h2 id="cubeTitle">NUMSTEP: CUBE</h2>
    <p class="cubeIntro">Complete the continuous path through every white cube.</p>
    <div class="cubeLayers" id="cubeLayers"></div>
</section>

<!-- Sponsor message box -->
<div class="sponsorBox" id="sponsorBox"></div>


<script src="cube.js"></script>

<!-- Game selector -->
<script>
    const moreButton = document.getElementById("moreButton");
    const moreMenu = document.getElementById("moreMenu");

    moreButton.addEventListener("click", function () {
        const isOpen = moreButton.getAttribute("aria-expanded") === "true";
        moreButton.setAttribute("aria-expanded", String(!isOpen));
        moreMenu.hidden = isOpen;
    });

    const cubeMenuLink = document.getElementById("cubeMenuLink");
    const cubeGame = document.getElementById("cube");
    const classicContent = Array.from(document.body.children).filter(function (el) {
        return !el.matches(".siteHeader, .moreMenu, .cubeGame, script");
    });

    cubeMenuLink.addEventListener("click", function (event) {
        event.preventDefault();
        cubeGame.hidden = false;
        classicContent.forEach(function (el) { el.hidden = true; });
        if (typeof renderNumstepCube === "function") renderNumstepCube();
        moreMenu.hidden = true;
        moreButton.setAttribute("aria-expanded", "false");
    });

    document.addEventListener("click", function (event) {
        if (
            !moreMenu.hidden &&
            !moreMenu.contains(event.target) &&
            !moreButton.contains(event.target)
        ) {
            moreMenu.hidden = true;
            moreButton.setAttribute("aria-expanded", "false");
        }
    });
</script>


<!-- PDF date navigation -->
<script>

    // Start with today's date
    let selectedDate = new Date();


    // Format date as YYYY-MM-DD
    // This matches your PDF filenames:
    // pdfs/2026-09-03.pdf

    function formatDate(date) {

        const year = date.getFullYear();

        const month = String(
            date.getMonth() + 1
        ).padStart(2, "0");

        const day = String(
            date.getDate()
        ).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }


    // Friendly date for display

    function displayDate(date) {

        return date.toLocaleDateString(
            "en-GB",
            {
                weekday: "short",
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        );

    }


    // Update displayed date and PDF link

   
    function loadSelectedPuzzle() {

    const filenameDate = formatDate(selectedDate);

    window.selectedDateString = filenameDate;

    // Tell script8.js to load the puzzle for this date
    if (typeof loadPuzzleForDate === "function") {
        loadPuzzleForDate(filenameDate);
    }
}
 

    function updateDateNavigation() {

        const filenameDate =
            formatDate(selectedDate);


        // Make the date available to script8.js
window.selectedDateString = filenameDate;


        // Show selected date

        document.getElementById(
            "currentDate"
        ).textContent =
            displayDate(selectedDate);


        // Update PDF link

        document.getElementById(
            "pdfLink"
        ).href =
            `pdfs/${filenameDate}.pdf`;


        // Prevent users going into the future

        const today = new Date();

        today.setHours(0, 0, 0, 0);


        const selected = new Date(selectedDate);

        selected.setHours(0, 0, 0, 0);


        document.getElementById(
            "nextDay"
        ).disabled =
            selected >= today;

    }


    // Previous day

           document.getElementById("prevDay").addEventListener(
    "click",
    function () {

        selectedDate.setDate(
            selectedDate.getDate() - 1
        );

        updateDateNavigation();
        loadSelectedPuzzle();

    }
);


    // Next day

    document.getElementById("nextDay").addEventListener(
    "click",
    function () {

        const today = new Date();

        today.setHours(0, 0, 0, 0);


        const nextDate = new Date(selectedDate);

        nextDate.setDate(
            nextDate.getDate() + 1
        );


        if (nextDate <= today) {

            selectedDate = nextDate;

            updateDateNavigation();
            loadSelectedPuzzle();

        }

    }
);


    // Initialise page

    updateDateNavigation();

</script>


<!-- Existing Numstep game -->
<script src="badge4.js"></script>
<script src="script8.js"></script>
<script src="share.js"></script>
<script src="sponsor.js"></script>

</body>

</html>
