name: Generate Daily Numstep Taurus

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write

jobs:
  generate-taurus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab
      - name: Generate Taurus puzzles
        run: python tools/numstep-taurus/generate_daily.py
      - name: Commit generated puzzles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/numstep-taurus/data/ games/numstep-taurus/printables/
          git commit -m "Generate daily Numstep Taurus puzzles" || echo "No changes to commit"
          git push
