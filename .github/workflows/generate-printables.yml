name: Refresh daily Numstep printables

on:
  workflow_dispatch:
  schedule:
    - cron: "35 0 * * *"

permissions:
  contents: write

jobs:
  generate-printables:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab

      - name: Generate refreshed printable PDFs
        run: python tools/printables/generate_printables.py

      - name: Save refreshed printables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/numstep/printables/
          git add games/numstep-cube/printables/
          git add games/numstep-taurus/printables/
          git add games/numstep-box/printables/
          git commit -m "Refresh daily Numstep printables" || echo "No changes to commit"
          git push
