name: Generate Daily Numstep Classic

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *"

permissions:
  contents: write

jobs:
  generate-classic:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab

      - name: Generate Classic puzzles and printable
        run: python tools/numstep/generate_daily.py

      - name: Save Classic puzzle resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/numstep/data/
          git add games/numstep/printables/
          git commit -m "Generate daily Numstep Classic puzzles" || echo "No changes to commit"
          git push

      - name: Publish Classic resources to Numstep_Live
        env:
          LIVE_REPO_TOKEN: ${{ secrets.LIVE_REPO_TOKEN }}
        run: |
          if [ -z "$LIVE_REPO_TOKEN" ]; then
            echo "LIVE_REPO_TOKEN is not configured."
            exit 1
          fi
          git clone "https://x-access-token:${LIVE_REPO_TOKEN}@github.com/Numstep/Numstep_Live.git" live
          mkdir -p live/games/numstep/data live/games/numstep/printables
          cp -a games/numstep/data/. live/games/numstep/data/
          cp -a games/numstep/printables/. live/games/numstep/printables/
          cd live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/numstep/data/ games/numstep/printables/
          git commit -m "Publish daily Numstep Classic resources" || echo "No changes to commit"
          git push origin main
