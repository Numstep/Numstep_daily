name: Generate Daily Numstep

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab

      - name: Generate Numstep puzzles and PDF
        run: |
          python tools/numstep/generate_daily.py
          python tools/numstep/generate_cube_daily.py

      - name: Save generated puzzle resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/numstep/data/
          git add games/numstep/printables/
          git add games/numstep-cube/data/
          git add games/numstep-cube/printables/
          git commit -m "Generate daily Numstep puzzles and printables" || echo "No changes to commit"
          git push
