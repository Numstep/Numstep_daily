name: Generate Numstep

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install reportlab

      - name: Generate Numstep
        run: |
          python numstep_daily_unique.py