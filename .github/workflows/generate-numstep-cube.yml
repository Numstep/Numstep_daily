name: Generate Daily Numstep Cube

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"

permissions:
  contents: write

jobs:
  generate-cube:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab

      - name: Generate Cube puzzle and printable
        run: python tools/numstep/generate_cube_daily.py

      - name: Generate Cube sharing puzzle
        run: |
          cd tools/numstep
          python generate_cube_share.py

      - name: Save Cube puzzle resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/numstep-cube/data/
          git add games/numstep-cube/printables/
          git commit -m "Generate daily Numstep Cube puzzle" || echo "No changes to commit"
          git push

      - name: Publish Cube resources to Numstep_Live
        env:
          LIVE_REPO_TOKEN: ${{ secrets.LIVE_REPO_TOKEN }}
        run: |
          if [ -z "$LIVE_REPO_TOKEN" ]; then
            echo "LIVE_REPO_TOKEN is not configured."
            exit 1
          fi
          git clone "https://x-access-token:${LIVE_REPO_TOKEN}@github.com/Numstep/Numstep_Live.git" live
          mkdir -p live/games/numstep-cube/data live/games/numstep-cube/printables
          cp -a games/numstep-cube/data/. live/games/numstep-cube/data/
          cp -a games/numstep-cube/printables/. live/games/numstep-cube/printables/
          cd live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/numstep-cube/data/ games/numstep-cube/printables/
          git commit -m "Publish daily Numstep Cube resources" || echo "No changes to commit"
          git push origin main
