name: Generate Daily Numstep Box

on:
  workflow_dispatch:
  schedule:
    - cron: "25 0 * * *"

permissions:
  contents: write

jobs:
  generate-box:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab

      - name: Generate Box puzzle, printable, and share image
        run: python tools/numstep-box/numstep_box.py

      - name: Save Box puzzle resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/numstep-box/data/
          git add games/numstep-box/printables/
          git add games/numstep-box/share/
          git commit -m "Generate daily Numstep Box puzzle" || echo "No changes to commit"
          git push

      - name: Publish Box resources to Numstep_Live
        env:
          LIVE_REPO_TOKEN: ${{ secrets.LIVE_REPO_TOKEN }}
        run: |
          if [ -z "$LIVE_REPO_TOKEN" ]; then
            echo "LIVE_REPO_TOKEN is not configured."
            exit 1
          fi
          git clone "https://x-access-token:${LIVE_REPO_TOKEN}@github.com/Numstep/Numstep_Live.git" live
          mkdir -p live/games/numstep-box/data live/games/numstep-box/printables live/games/numstep-box/share
          cp -a games/numstep-box/data/. live/games/numstep-box/data/
          cp -a games/numstep-box/printables/. live/games/numstep-box/printables/
          cp -a games/numstep-box/share/. live/games/numstep-box/share/
          cd live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/numstep-box/data/ games/numstep-box/printables/ games/numstep-box/share/
          git commit -m "Publish daily Numstep Box resources" || echo "No changes to commit"
          git push origin main
