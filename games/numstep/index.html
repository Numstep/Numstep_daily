<script>const moreButton=document.getElementById("moreButton"),moreMenu=document.getElementById("moreMenu");moreButton.addEventListener("click",()=>{const open=moreButton.getAttribute("aria-expanded")==="true";moreButton.setAttribute("aria-expanded",String(!open));moreMenu.hidden=open});document.addEventListener("click",e=>{if(!moreMenu.hidden&&!moreMenu.contains(e.target)&&!moreButton.contains(e.target)){moreMenu.hidden=true;moreButton.setAttribute("aria-expanded","false")}});let selectedDate=new Date();function formatDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function displayDate(d){return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}function loadSelectedPuzzle(){const ds=formatDate(selectedDate);window.selectedDateString=ds;if(typeof loadPuzzleForDate==="function")loadPuzzleForDate(ds)}function updateDateNavigation(){const ds=formatDate(selectedDate);window.selectedDateString=ds;document.getElementById("currentDate").textContent=displayDate(selectedDate);document.getElementById("pdfLink").href=`printables/${ds}.pdf`;const t=new Date();t.setHours(0,0,0,0);const s=new Date(selectedDate);s.setHours(0,0,0,0);document.getElementById("nextDay").disabled=s>=t}document.getElementById("prevDay").onclick=()=>{selectedDate.setDate(selectedDate.getDate()-1);updateDateNavigation();loadSelectedPuzzle()};document.getElementById("nextDay").onclick=()=>{const t=new Date();t.setHours(0,0,0,0);const n=new Date(selectedDate);n.setDate(n.getDate()+1);if(n<=t){selectedDate=n;updateDateNavigation();loadSelectedPuzzle()}};updateDateNavigation();</script>
