<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">


<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Numstep - Daily Challenge</title>

<link rel="stylesheet" href="../../shared/styles/main.css">


</head>

<body>

<header class="siteHeader">
    <div class="siteHeaderBrand">NUMSTEP</div>
    <button class="moreButton" id="moreButton" aria-expanded="false" aria-controls="moreMenu">
        <span class="hamburgerIcon" aria-hidden="true">☰</span>
        <span>more</span>
    </button>
</header>

<nav class="moreMenu" id="moreMenu" hidden aria-label="Game varieties">
    <a class="gameMenuItem active" href="index.html" aria-current="page">Classic</a>
</nav>


<h1 class="visuallyHidden">NUMSTEP</h1>

<h2>Daily Challenge</h2>


<!-- Date navigation -->
<div class="date-navigation">

    <button id="prevDay" aria-label="Previous day">
        ←
    </button> <div id="currentDate"></div> <button id="nextDay" aria-label="Next day">
        →
    </button>

</div>


<!-- Printable PDF -->
<div class="printable-puzzle">

    <a id="pdfLink" href="#" target="_blank">
        <button>
            🖨️ Printable Puzzle
        </button>
    </a>

</div>


<!-- Game information -->
<div id="timer">00:00</div>

<div id="attempts">Attempts: 0</div>


<!-- Numstep grid -->
<div id="grid"></div>


<!-- Messages -->
<div id="message"></div>


<!-- Reset button -->
<button id="resetButton">RESET</button>

<!-- Sponsor message box -->
<div class="sponsorBox" id="sponsorBox"></div>





<script>
const moreButton = document.getElementById("moreButton");
const moreMenu = document.getElementById("moreMenu");
moreButton.addEventListener("click", () => {
 const open = moreButton.getAttribute("aria-expanded") === "true";
 moreButton.setAttribute("aria-expanded", String(!open));
 moreMenu.hidden = open;
});
document.addEventListener("click", event => {
 if (!moreMenu.hidden && !moreMenu.contains(event.target) && !moreButton.contains(event.target)) {
  moreMenu.hidden = true;
  moreButton.setAttribute("aria-expanded", "false");
 }
});
</script>

<!-- PDF date navigation -->
<script>

    // Start with today's date
    let selectedDate = new Date();


    // Format date as YYYY-MM-DD
    // This matches your PDF filenames:
    // pdfs/2026-09-03.pdf

    function formatDate(date) {

        const year = date.getFullYear();

        const month = String(
            date.getMonth() + 1
        ).padStart(2, "0");

        const day = String(
            date.getDate()
        ).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }


    // Friendly date for display

    function displayDate(date) {

        return date.toLocaleDateString(
            "en-GB",
            {
                weekday: "short",
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        );

    }


    // Update displayed date and PDF link

   
    function loadSelectedPuzzle() {

    const filenameDate = formatDate(selectedDate);

    window.selectedDateString = filenameDate;

    // Tell script8.js to load the puzzle for this date
    if (typeof loadPuzzleForDate === "function") {
        loadPuzzleForDate(filenameDate);
    }
}
 

    function updateDateNavigation() {

        const filenameDate =
            formatDate(selectedDate);


        // Make the date available to script8.js
window.selectedDateString = filenameDate;


        // Show selected date

        document.getElementById(
            "currentDate"
        ).textContent =
            displayDate(selectedDate);


        // Update PDF link

        document.getElementById(
            "pdfLink"
        ).href =
            `printables/${filenameDate}.pdf`;


        // Prevent users going into the future

        const today = new Date();

        today.setHours(0, 0, 0, 0);


        const selected = new Date(selectedDate);

        selected.setHours(0, 0, 0, 0);


        document.getElementById(
            "nextDay"
        ).disabled =
            selected >= today;

    }


    // Previous day

           document.getElementById("prevDay").addEventListener(
    "click",
    function () {

        selectedDate.setDate(
            selectedDate.getDate() - 1
        );

        updateDateNavigation();
        loadSelectedPuzzle();

    }
);


    // Next day

    document.getElementById("nextDay").addEventListener(
    "click",
    function () {

        const today = new Date();

        today.setHours(0, 0, 0, 0);


        const nextDate = new Date(selectedDate);

        nextDate.setDate(
            nextDate.getDate() + 1
        );


        if (nextDate <= today) {

            selectedDate = nextDate;

            updateDateNavigation();
            loadSelectedPuzzle();

        }

    }
);


    // Initialise page

    updateDateNavigation();

</script>


<!-- Existing Numstep game -->
<script src="js/badge.js"></script>
<script src="js/game.js"></script>
<script src="../../shared/js/share.js"></script>
<script src="../../shared/js/sponsor.js"></script>

</body>

</html>
