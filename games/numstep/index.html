<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Numstep - Daily Challenge</title><link rel="stylesheet" href="../../shared/styles/main.css"><link rel="stylesheet" href="../../shared/styles/puzzle-ui.css"></head>
<body data-rules-variant="classic">
<header class="siteHeader"><div class="siteHeaderBrand">NUMSTEP</div><div class="headerControls"><button class="themeToggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Switch to dark theme"><span class="themeToggleIcon" aria-hidden="true">◐</span><span id="themeToggleLabel">dark</span></button><button class="moreButton" id="moreButton" aria-expanded="false" aria-controls="moreMenu"><span class="hamburgerIcon" aria-hidden="true">☰</span><span>more</span></button></div></header>
<nav class="moreMenu" id="moreMenu" hidden aria-label="Site navigation"><a class="gameMenuItem active" href="index.html" aria-current="page">Classic</a><a class="gameMenuItem" href="../numstep-cube/index.html">Cube</a><a class="gameMenuItem" href="../numstep-taurus/index.html">Torus</a><a class="gameMenuItem" href="../numstep-box/index.html">Box</a><a class="gameMenuItem" href="about.html">About</a></nav>
<h1 class="visuallyHidden">NUMSTEP</h1><h2>Daily Challenge</h2>
<div class="date-navigation"><button id="prevDay" aria-label="Previous day">←</button><div id="currentDate"></div><button id="nextDay" aria-label="Next day">→</button></div>
<div class="printable-puzzle"><a id="pdfLink" href="#" target="_blank"><button>🖨️ Printable Puzzle</button></a></div>

<script>const moreButton=document.getElementById("moreButton"),moreMenu=document.getElementById("moreMenu");moreButton.addEventListener("click",()=>{const open=moreButton.getAttribute("aria-expanded")==="true";moreButton.setAttribute("aria-expanded",String(!open));moreMenu.hidden=open});document.addEventListener("click",e=>{if(!moreMenu.hidden&&!moreMenu.contains(e.target)&&!moreButton.contains(e.target)){moreMenu.hidden=true;moreButton.setAttribute("aria-expanded","false")}});</script>
