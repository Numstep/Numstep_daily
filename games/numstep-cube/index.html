<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numstep:Cube - Daily Challenge</title>
    <link rel="stylesheet" href="../../shared/styles/main.css">
    <link rel="stylesheet" href="cube.css">
</head>
<body>
<header class="siteHeader">
    <div class="siteHeaderBrand">NUMSTEP</div>
    <button class="moreButton" id="moreButton" type="button" aria-expanded="false" aria-controls="moreMenu">
        <span class="hamburgerIcon" aria-hidden="true">☰</span>
        <span>more</span>
    </button>
</header>

<nav class="moreMenu" id="moreMenu" hidden aria-label="Game varieties">
    <a class="gameMenuItem" href="../numstep/index.html">Classic</a>
    <a class="gameMenuItem active" href="index.html" aria-current="page">Cube</a>
    <a class="gameMenuItem" href="../numstep-taurus/index.html">Taurus</a>
</nav>

<h1 class="visuallyHidden">NUMSTEP: CUBE</h1>
<h2>Cube</h2>

<div class="date-navigation">
    <button id="prevDay" aria-label="Previous day">←</button>
    <div id="currentDate"></div>
    <button id="nextDay" aria-label="Next day">→</button>
</div>

<div class="printable-puzzle">
    <a id="pdfLink" href="#" target="_blank" rel="noopener noreferrer">
        <button type="button">🖨️ Printable Puzzle</button>
    </a>
</div>

<div class="cube-status">
    <div id="timer">00:00</div>
    <div id="cubeProgress">0 / 0</div>
    <div id="attempts">Attempts: 0</div>
</div>

<div id="cubeGrid" class="cubeGrid" aria-label="Numstep Cube puzzle"></div>

<div id="message" role="status" aria-live="polite"></div>

<button id="resetButton" type="button">RESET</button>

<div class="sponsorBox" id="sponsorBox"></div>

<script src="../numstep/js/badge.js"></script>
<script src="../../shared/js/share.js"></script>
<script src="cube.js"></script>
<script src="../../shared/js/sponsor.js"></script>
</body>
</html>
