<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numstep: Box - Daily Challenge</title>
<link rel="stylesheet" href="../../shared/styles/main.css">
<link rel="stylesheet" href="box.css">
</head>
<body>
<header class="siteHeader">
  <div class="siteHeaderBrand">NUMSTEP</div>
  <div class="headerControls">
    <button class="themeToggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Switch to dark theme"><span class="themeToggleIcon" aria-hidden="true">◐</span><span id="themeToggleLabel">dark</span></button>
    <button class="moreButton" id="moreButton" type="button" aria-expanded="false" aria-controls="moreMenu"><span class="hamburgerIcon" aria-hidden="true">☰</span><span>more</span></button>
  </div>
</header>
<nav class="moreMenu" id="moreMenu" hidden aria-label="Game varieties">
  <a class="gameMenuItem" href="../numstep/index.html">Classic</a>
  <a class="gameMenuItem" href="../numstep-cube/index.html">Cube</a>
  <a class="gameMenuItem" href="../numstep-taurus/index.html">Taurus</a>
  <a class="gameMenuItem active" href="index.html" aria-current="page">Box</a>
</nav>
<h1 class="visuallyHidden">NUMSTEP: BOX</h1>
<h2>Box</h2>
<div class="date-navigation"><button id="prevDay" aria-label="Previous day">←</button><div id="currentDate"></div><button id="nextDay" aria-label="Next day">→</button></div>
<div class="printable-puzzle"><a id="pdfLink" href="#" target="_blank" rel="noopener noreferrer"><button type="button">🖨️ Printable Puzzle</button></a></div>
<div class="box-status"><div id="timer">00:00</div><div id="boxProgress">0 / 0</div><div id="attempts">Attempts: 0</div></div>
<div id="boxGrid" class="boxGrid" aria-label="Numstep Box puzzle"></div>
<div id="message" role="status" aria-live="polite"></div>
<button id="resetButton" type="button">RESET</button>
<div class="sponsorBox" id="sponsorBox"></div>
<script src="../../shared/js/theme.js"></script>
<script src="../numstep/js/badge.js"></script>
<script src="../../shared/js/share.js"></script>
<script src="box.js"></script>
<script src="../../shared/js/box-drag.js"></script>
<script src="../../shared/js/sponsor.js"></script>
</body>
</html>
